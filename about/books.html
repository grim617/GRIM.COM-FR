  const track = document.getElementById('bookTrack');
  const browse = document.getElementById('bookBrowse');
  const detail = document.getElementById('bookDetail');
  const backBtn = document.getElementById('bookBack');

  const detailCover = document.getElementById('bookDetailCover');
  const detailMeta = document.getElementById('bookDetailMeta');
  const detailTitle = document.getElementById('bookDetailTitle');
  const detailStars = document.getElementById('bookDetailStars');
  const detailReview = document.getElementById('bookDetailReview');
  const detailTags = document.getElementById('bookDetailTags');

  function starString(n) {
    return '&#9733;'.repeat(n) + '&#9734;'.repeat(5 - n);
  }

  function coverHTML(book) {
    if (book.image) {
      return `<div class="book-cover-art has-image"><img src="${book.image}" alt="${book.title} cover"></div>`;
    }
    return `<div class="book-cover-art" style="background: linear-gradient(160deg, ${book.coverColor}, #000);">
      <span class="book-cover-title">${book.title}</span>
      <span class="book-cover-author">${book.author}</span>
    </div>`;
  }

  books.forEach((book, i) => {
    const cover = document.createElement('div');
    cover.className = 'book-cover';
    cover.innerHTML = coverHTML(book);
    cover.addEventListener('click', () => openDetail(i));
    track.appendChild(cover);
  });

  function openDetail(i) {
    const book = books[i];
    detailCover.innerHTML = coverHTML(book);
    detailMeta.textContent = book.finished || '';
    detailTitle.textContent = `${book.title} — ${book.author}`;
    detailStars.innerHTML = starString(book.rating);
    detailReview.textContent = book.review;
    detailTags.innerHTML = (book.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

    browse.style.display = 'none';
    detail.classList.add('active');
  }

  function closeDetail() {
    detail.classList.remove('active');
    browse.style.display = 'block';
  }

  backBtn.addEventListener('click', closeDetail);
