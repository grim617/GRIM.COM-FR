<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRiM.COM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0A0B;
    --bg-2: #141416;
    --ink: #EDEDEF;
    --ink-dim: #86868C;
    --accent: #E4E4EA;
    --ring: #2A2A2D;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% 34%, var(--bg-2), var(--bg) 72%);
    color: var(--ink);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    min-height:100%;
  }

  header.top{
    position:fixed;
    top: calc(26px + env(safe-area-inset-top, 0px));
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:0 clamp(20px,5vw,56px);
    font-size:12.5px;
    letter-spacing:.02em;
    color:var(--ink-dim);
    pointer-events:none;
    z-index:5;
  }

  .wrap{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10vh 5vw 8vh;
  }

  /* ============ core sizing tokens ============ */
  .fan{
    --hubD: clamp(150px, 20vmin, 160px);
    --hubR: calc(var(--hubD) / 2);
    --baseW: clamp(128px, 17vmin, 136px);   /* capped so wide-but-short fullscreen windows don't balloon past the tall-narrow panel view */
    --baseH: calc(var(--baseW) * 0.658);
    --dip: clamp(12px, 2vmin, 20px);        /* small overlap into the logo's circle, just enough for the curve */
    --imgW: var(--baseW);
    --imgH: calc(var(--baseH) + var(--dip));
    --peekTop: calc(0.58 * var(--baseH));
    --risenTop: 0px;
    --idleTop: calc(var(--imgH) + var(--glowPad));
    /* second (side) peek figure — own box, sized from its portrait crop's
       real aspect ratio (504x900) so object-fit:cover doesn't crop it badly */
    --baseH2: clamp(90px, 12vmin, 96px);   /* capped for the same reason as baseW */
    --baseW2: calc(var(--baseH2) * 0.56);
    --imgW2: var(--baseW2);
    --imgH2: calc(var(--baseH2) + var(--dip));
    --peekTop2: calc(0.30 * var(--baseH2));  /* reveals head only on hub-hover, matching how tight the yellow figure's peek reads (that one's just a smaller fraction of a shorter image; this portrait is much taller, so it needs a smaller fraction to stop at the jaw instead of the hand/shoulder) */
    --risenTop2: 0px;
    --idleTop2: calc(var(--imgH2) + var(--glowPad));
    --sideOffsetX: clamp(45px, 9vmin, 68px); /* capped lower so fullscreen-width windows converge to the same spacing the half-window view already showed, instead of growing past it */
    /* third (right side) peek figure — photo/video, real crop is 228x368 */
    --baseH3: clamp(90px, 12vmin, 96px);
    --baseW3: calc(var(--baseH3) * 0.62);
    --imgW3: var(--baseW3);
    --imgH3: calc(var(--baseH3) + var(--dip));
    --peekTop3: calc(0.30 * var(--baseH3));
    --risenTop3: 0px;
    --idleTop3: calc(var(--imgH3) + var(--glowPad));
    --levelAdjust3: calc(var(--baseH3) - var(--baseH) + var(--peekTop) - var(--peekTop3));
    --extraDown3: clamp(16px, 3vmin, 28px);
    --tilt3: 18deg; /* pops out at a slant, tilted toward the right like it's leaning out */
    --sideOffsetX3: clamp(30px, 6vmin, 46px); /* pulled in closer to the hub/yellow than purple's offset, per request */
    /* The yellow and purple figures share one "risen" anchor line (their
       fully-risen bottoms land at the same height), but reveal different
       fractions of boxes of different heights while peeking, which by
       itself put purple's peeked head noticeably higher than yellow's.
       This shifts purple's peeked position down by exactly that gap so
       the two heads sit level with each other on hub-hover. */
    --levelAdjust2: calc(var(--baseH2) - var(--baseH) + var(--peekTop) - var(--peekTop2));
    --extraDown2: calc(clamp(16px, 3vmin, 28px) + 10px); /* nudges purple further down than the level-with-yellow position, per request; +10px to match yellow/green's level */
    --glowPad: clamp(28px, 6vmin, 48px); /* breathing room so the hover glow fades out instead of hard-clipping into a rectangle */
    position:relative;
    width:min(90vw, 560px);
    height:clamp(320px, 46vmin, 420px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ============ ORBIT (the whole solar system around the logo) ============ */
  /* The sun doesn't orbit anything — it just glows from dead center, behind
     the hub — so it's a static glow layer, not a ring. Everything else
     (Mercury -> Neptune) gets its own ring: distance from center increases
     outward, and orbit duration increases with it too (closer = faster),
     same real-solar-system logic just compressed to fit in a small circle.
     All rings spin the same direction (prograde), like the real thing —
     nothing here reverses. Distances/sizes are multiples of --hubR / 1px
     so they scale with the hub at every viewport, same pattern as
     everything else in here. */
  .orbit-system{
    position:absolute;
    top:50%; left:50%;
    width:0; height:0;
    pointer-events:none;
    opacity:1;
    transform:scale(1);
    transition: opacity .6s ease, transform .6s ease;
  }
  /* dissipates on the same hover state that makes the figures peek out,
     returns the moment you leave — no separate hover logic needed */
  .fan.peek .orbit-system{
    opacity:0;
    transform:scale(.82);
  }

  .orbit-ring{
    position:absolute;
    top:0; left:0;
    width:0; height:0;
    animation: orbitSpin linear infinite;
  }
  @keyframes orbitSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

  /* distance + period, closest to farthest — all prograde (no reverse) */
  .orbit-ring.mercury{ animation-duration:6s;  }
  .orbit-ring.venus  { animation-duration:9s;  }
  .orbit-ring.earth  { animation-duration:13s; }
  .orbit-ring.mars   { animation-duration:19s; }
  .orbit-ring.jupiter{ animation-duration:29s; }
  .orbit-ring.saturn { animation-duration:41s; }
  .orbit-ring.uranus { animation-duration:55s; }
  .orbit-ring.neptune{ animation-duration:70s; }

  .orbit-ring .planet{
    position:absolute;
    left:0; top:0;
    border-radius:50%;
  }

  .orbit-ring.mercury .planet{
    width:3.5px; height:3.5px; margin:-1.75px;
    transform:translateX(calc(var(--hubR) * 1.22));
    background: radial-gradient(circle at 35% 32%, #d8d0c2 0%, #a89c88 40%, #6f6555 75%, #443c30 100%);
  }

  .orbit-ring.venus .planet{
    width:5px; height:5px; margin:-2.5px;
    transform:translateX(calc(var(--hubR) * 1.36));
    background: radial-gradient(circle at 35% 32%, #fbeecb 0%, #e9cd8e 40%, #c49a4e 75%, #8a6a2e 100%);
    box-shadow: 0 0 3px rgba(230,190,120,.35);
  }

  /* earth — same lit-sphere + landmass look as before, now with a tiny
     moon nested inside it, riding its own fast little sub-orbit so it
     travels around earth exactly like earth travels around the hub */
  .orbit-ring.earth .planet{
    width:5.5px; height:5.5px; margin:-2.75px;
    transform:translateX(calc(var(--hubR) * 1.5));
    background:
      radial-gradient(circle at 60% 62%, #3fae62 0 22%, transparent 23%),
      radial-gradient(circle at 30% 28%, #bfe8ff 0%, #4fa3e0 22%, #1f6fb0 42%, #123a5e 66%, #051018 92%);
    box-shadow: 0 0 4px rgba(90,160,230,.45);
  }
  .moon-ring{
    position:absolute;
    top:50%; left:50%;
    width:0; height:0;
    animation: orbitSpin 2.6s linear infinite;
  }
  .moon-ring .moon{
    position:absolute;
    left:0; top:0;
    width:1.6px; height:1.6px; margin:-.8px;
    border-radius:50%;
    transform:translateX(6.5px);
    background: radial-gradient(circle at 35% 32%, #f4f4f4 0%, #c9c9c9 45%, #8f8f8f 80%, #6a6a6a 100%);
  }

  .orbit-ring.mars .planet{
    width:4.5px; height:4.5px; margin:-2.25px;
    transform:translateX(calc(var(--hubR) * 1.66));
    background: radial-gradient(circle at 35% 32%, #f0a67c 0%, #d16b3f 42%, #a13f1f 75%, #632310 100%);
  }

  /* jupiter — big banded gas giant, faint horizontal stripe via a linear
     overlay on top of the lit-sphere gradient */
  .orbit-ring.jupiter .planet{
    width:9px; height:9px; margin:-4.5px;
    transform:translateX(calc(var(--hubR) * 1.86));
    background:
      linear-gradient(180deg, transparent 38%, rgba(120,80,40,.35) 44%, transparent 50%, rgba(120,80,40,.28) 60%, transparent 66%),
      radial-gradient(circle at 33% 30%, #f0e0bf 0%, #dcb87e 35%, #b8863f 65%, #7a5325 100%);
    box-shadow: 0 0 3px rgba(200,160,100,.3);
  }

  /* saturn — pale gold sphere plus a thin tilted ring */
  .orbit-ring.saturn .planet{
    width:8px; height:8px; margin:-4px;
    transform:translateX(calc(var(--hubR) * 2.08));
    background: radial-gradient(circle at 34% 30%, #f7edc9 0%, #e0c584 38%, #b99a54 70%, #7d6631 100%);
  }
  .orbit-ring.saturn .planet::after{
    content:"";
    position:absolute;
    inset:-3px -7px;
    border:1px solid rgba(226,200,140,.65);
    border-radius:50%;
    transform:rotate(-18deg) scaleY(.34);
    pointer-events:none;
  }

  .orbit-ring.uranus .planet{
    width:6.5px; height:6.5px; margin:-3.25px;
    transform:translateX(calc(var(--hubR) * 2.3));
    background: radial-gradient(circle at 35% 32%, #d6f7f6 0%, #9fdedd 40%, #5fa8a8 75%, #366f70 100%);
  }

  .orbit-ring.neptune .planet{
    width:6.5px; height:6.5px; margin:-3.25px;
    transform:translateX(calc(var(--hubR) * 2.52));
    background: radial-gradient(circle at 35% 32%, #a9bdf5 0%, #6c86d8 40%, #3d54a8 75%, #202f6e 100%);
    box-shadow: 0 0 3px rgba(90,110,210,.4);
  }

  @media (prefers-reduced-motion: reduce){
    .orbit-ring, .moon-ring{ animation-duration:.01ms !important; }
  }

  /* faint static halo behind hub, always present, purely decorative */
  .fan::before{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:calc(var(--hubD) * 1.28);
    height:calc(var(--hubD) * 1.28);
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid var(--ring);
    opacity:.55;
    z-index:1;
  }

  /* ---- HUB (logo) ---- */
  .hub{
    position:absolute;
    top:50%; left:50%;
    width:var(--hubD);
    height:var(--hubD);
    transform:translate(-50%,-50%) scale(1);
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    transition: transform .5s cubic-bezier(.22,.85,.25,1), filter .5s;
    filter: drop-shadow(0 0 0 transparent);
  }
  .fan.peek .hub{
    transform:translate(-50%,-50%) scale(1.06);
    filter: drop-shadow(0 0 30px rgba(228,228,234,.3));
  }
  .hub img{ width:100%; height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none; }

  /* invisible hit-zone, sized a touch larger than the hub for a forgiving hover target */
  .hub-hit{
    position:absolute; top:50%; left:50%;
    width:calc(var(--hubD) * 1.12);
    height:calc(var(--hubD) * 1.12);
    transform:translate(-50%,-50%);
    border-radius:50%;
    z-index:15;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---- PEEKING FIGURE ---- */
  /* the window: purely a clip region, no fill/border/shadow of its own.
     It overlaps the hub's own circle so we can mask that overlap into
     a curve that matches the logo's roundness instead of a flat cut. */
  .peekbox{
    position:absolute;
    top:50%; left:50%;
    width:calc(var(--imgW) + 2 * var(--glowPad));
    height:calc(var(--imgH) + 2 * var(--glowPad));
    overflow:hidden;
    transform: translate(-50%, calc(-100% + var(--glowPad) - var(--hubR) + var(--dip)));
    -webkit-mask-image: radial-gradient(circle at 50% calc(100% - var(--glowPad) + var(--hubR) - var(--dip)),
        transparent 0,
        transparent calc(var(--hubR) - 1.5px),
        black calc(var(--hubR) + 1.5px),
        black 100%);
    mask-image: radial-gradient(circle at 50% calc(100% - var(--glowPad) + var(--hubR) - var(--dip)),
        transparent 0,
        transparent calc(var(--hubR) - 1.5px),
        black calc(var(--hubR) + 1.5px),
        black 100%);
    z-index:20;
    pointer-events:none;
    -webkit-tap-highlight-color:transparent;
  }

  .peekbox img{
    position:absolute;
    top:var(--glowPad); left:var(--glowPad);
    width:var(--imgW);
    height:var(--imgH);
    object-fit:cover;
    transform: translateY(var(--idleTop));
    transition: transform .6s cubic-bezier(.22,.9,.24,1), filter .4s ease;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.5));
    pointer-events:none;
  }
  /* idle: fully hidden behind the hub */
  .fan .peekbox img{ transform: translateY(var(--idleTop)); }
  /* hovering the hub: head/shoulders peek out above it — hit-area matches the
     actual character (not the glow padding), so a full rise only happens once
     you deliberately hover the figure itself, not the moment you touch the logo */
  .fan.peek .peekbox img{
    transform: translateY(var(--peekTop));
    pointer-events:auto;
    cursor:pointer;
  }
  /* hovering the figure itself: rises further to full view, ready to click.
     Selector is deliberately more specific than ".fan.peek .peekbox img"
     above (4 classes vs 3) so it actually wins while peeked — otherwise the
     peeked position keeps overriding this by specificity regardless of
     class order. */
  .fan.peek .peekbox.risen img{
    transform: translateY(var(--risenTop));
    filter: drop-shadow(0 14px 26px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(228,228,234,.22));
  }

  .peek-label{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%, calc(-1 * (var(--hubR) + var(--baseH)) - 20px));
    font-size:12px;
    color:var(--ink-dim);
    white-space:nowrap;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    z-index:32;
    pointer-events:none;
  }
  #peekbox.risen ~ .peek-label{ opacity:1; }

  /* ============ SOCIALS ============ */
  .socials{
    position:absolute;
    top:50%; left:50%;
    display:flex;
    gap:20px;
    transform:translate(-50%, calc(var(--hubR) + 34px));
    opacity:0;
    pointer-events:none;
    transition: opacity .4s ease .1s, transform .5s cubic-bezier(.22,.85,.25,1) .1s;
    z-index:5;
  }
  .fan.peek .socials{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%, calc(var(--hubR) + 50px));
  }

  .social-icon{
    width:36px; height:36px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-2);
    border:1px solid var(--ring);
    transition: border-color .3s, transform .3s, box-shadow .3s;
  }
  .social-icon:hover{
    border-color:var(--accent);
    transform:translateY(-3px);
    box-shadow: 0 10px 24px -10px rgba(228,228,234,.4);
  }
  .social-icon svg{ width:44%; height:44%; stroke:var(--ink-dim); transition:stroke .3s; }
  .social-icon:hover svg{ stroke:var(--accent); }

  .hint{
    margin-top:16px;
    font-size:13px;
    color:var(--ink-dim);
    text-align:center;
    max-width:280px;
  }
  .hint b{ color:var(--ink); font-weight:600; }

  /* ============ MUSIC PLAYER HINT (nudge toward the player) ============ */
  /* Sits above the play button. Hidden the moment a track starts playing,
     and comes back whenever playback is paused (or before it's ever been
     started) — tied directly to the audio's own play/pause state. */
  .player-hint{
    position:fixed;
    right: clamp(20px,5vw,56px);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px) + 58px);
    pointer-events:none;
    z-index:39;
    opacity:1;
    transform:translateY(0);
    transition: opacity .5s ease, transform .5s ease;
  }
  .player-hint span{
    font-size:12.5px;
    color:var(--ink-dim);
    white-space:nowrap;
  }
  .player-hint.hidden{
    opacity:0;
    transform:translateY(8px);
  }

  /* ============ MUSIC PLAYER MENU (bottom-right: prev / play-pause / next) ============ */
  .player-menu{
    position:fixed;
    right: clamp(20px,5vw,56px);
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    display:flex;
    align-items:center;
    z-index:40;
  }

  /* the smaller prev/next buttons flanking the main play/pause button —
     collapsed to nothing by default (0 width, 0 border, invisible), and
     only expand out once the center button is actually playing. Width,
     border-width and margin all animate together on the same timing so
     there's no visible sliver mid-collapse; :has() ties this straight to
     the play button's own .playing class, so there's nothing extra to
     keep in sync in JS. */
  .player-nav-btn{
    width:0; height:36px;
    margin:0;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-2);
    border:0 solid var(--ring);
    color:var(--ink-dim);
    opacity:0;
    overflow:hidden;
    pointer-events:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:
      width .35s cubic-bezier(.22,.85,.25,1),
      margin .35s cubic-bezier(.22,.85,.25,1),
      border-width .35s cubic-bezier(.22,.85,.25,1),
      opacity .25s ease,
      border-color .3s, color .3s, transform .3s, box-shadow .3s;
  }
  .player-menu:has(.player-btn.playing) .player-nav-btn{
    width:36px;
    border-width:1px;
    opacity:1;
    pointer-events:auto;
  }
  .player-menu:has(.player-btn.playing) #prevBtn{ margin-right:10px; }
  .player-menu:has(.player-btn.playing) #nextBtn{ margin-left:10px; }
  .player-nav-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
    transform:translateY(-2px);
    box-shadow: 0 8px 18px -8px rgba(228,228,234,.4);
  }
  .player-nav-btn svg{ width:42%; height:42%; flex-shrink:0; }

  .player-btn{
    position:relative;
    width:48px; height:48px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-2);
    border:1px solid var(--ring);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition: border-color .3s, transform .3s, box-shadow .3s;
  }
  .player-btn:hover{
    border-color:var(--accent);
    transform:translateY(-3px);
    box-shadow: 0 10px 24px -10px rgba(228,228,234,.4);
  }
  .player-btn svg{ width:44%; height:44%; stroke:var(--ink-dim); transition:stroke .3s; }
  .player-btn:hover svg{ stroke:var(--accent); }
  /* soft pulsing ring while a track is actually playing */
  .player-btn::after{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:50%;
    border:1px solid var(--accent);
    opacity:0;
    transform:scale(1);
  }
  .player-btn.playing::after{
    animation: playerPulse 1.6s ease-out infinite;
  }
  .player-btn.playing svg{ stroke:var(--accent); }
  @keyframes playerPulse{
    0%   { opacity:.5; transform:scale(1); }
    100% { opacity:0;  transform:scale(1.45); }
  }

  /* play-triangle shown while paused/stopped, swaps for the bouncing
     equalizer bars the moment audio is actually playing */
  .player-btn .icon-play{ display:block; fill:var(--ink-dim); transition:fill .3s; }
  .player-btn:hover .icon-play{ fill:var(--accent); }
  .player-btn .bars{ display:none; }
  .player-btn.playing .icon-play{ display:none; }
  .player-btn.playing .bars{ display:block; }
  /* the three volume bars swap for a tiny "now playing" bounce when active */
  .player-btn .bars rect{ transition: height .2s ease, y .2s ease; }
  .player-btn.playing .bars rect:nth-child(1){ animation: barBounce 0.9s ease-in-out infinite; }
  .player-btn.playing .bars rect:nth-child(2){ animation: barBounce 0.9s ease-in-out infinite .15s; }
  .player-btn.playing .bars rect:nth-child(3){ animation: barBounce 0.9s ease-in-out infinite .3s; }
  @keyframes barBounce{
    0%, 100% { transform: scaleY(.4); }
    50%      { transform: scaleY(1); }
  }
  .player-btn .bars rect{ transform-box: fill-box; transform-origin: center; }

  /* ============ SIDE PEEKS (emerge from behind the hub, offset to a side) ============ */
  /* Same "hidden behind the hub -> peek -> rise" mechanic as .peekbox, just
     positioned off-center so it ends up beside the hub instead of on top of it.
     Sized from the portrait image's own aspect ratio so object-fit:cover
     doesn't crop it awkwardly (yellow's crop is landscape, this one is portrait). */
  .side-peek{
    position:absolute;
    top:50%; left:50%;
    width:calc(var(--imgW2) + 2 * var(--glowPad));
    height:calc(var(--imgH2) + 2 * var(--glowPad));
    overflow:hidden;
    z-index:20;
    pointer-events:none;
    -webkit-tap-highlight-color:transparent;
  }

  .side-peek.dir-left{
    transform: translate(calc(-50% - var(--sideOffsetX)), calc(-100% + var(--glowPad) - var(--hubR) + var(--dip)));
    -webkit-mask-image: radial-gradient(circle at calc(50% + var(--sideOffsetX)) calc(100% - var(--glowPad) + var(--hubR) - var(--dip)),
        transparent 0,
        transparent calc(var(--hubR) - 1.5px),
        black calc(var(--hubR) + 1.5px),
        black 100%);
    mask-image: radial-gradient(circle at calc(50% + var(--sideOffsetX)) calc(100% - var(--glowPad) + var(--hubR) - var(--dip)),
        transparent 0,
        transparent calc(var(--hubR) - 1.5px),
        black calc(var(--hubR) + 1.5px),
        black 100%);
  }

  .side-peek.dir-right{
    transform: translate(calc(-50% + var(--sideOffsetX3)), calc(-100% + var(--glowPad) - var(--hubR) + var(--dip))) rotate(var(--tilt3));
    transform-origin: calc(50% - var(--sideOffsetX3)) calc(100% - var(--glowPad) + var(--hubR) - var(--dip));
    -webkit-mask-image: radial-gradient(circle at calc(50% - var(--sideOffsetX3)) calc(100% - var(--glowPad) + var(--hubR) - var(--dip)),
        transparent 0,
        transparent calc(var(--hubR) - 1.5px),
        black calc(var(--hubR) + 1.5px),
        black 100%);
    mask-image: radial-gradient(circle at calc(50% - var(--sideOffsetX3)) calc(100% - var(--glowPad) + var(--hubR) - var(--dip)),
        transparent 0,
        transparent calc(var(--hubR) - 1.5px),
        black calc(var(--hubR) + 1.5px),
        black 100%);
  }

  .side-peek img{
    position:absolute;
    top:calc(var(--glowPad) + var(--levelAdjust2) + var(--extraDown2)); left:var(--glowPad);
    width:var(--imgW2); height:var(--imgH2);
    object-fit:cover;
    user-select:none; -webkit-user-drag:none;
    transition: transform .6s cubic-bezier(.22,.9,.24,1), filter .4s ease;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.5));
    pointer-events:none;
  }
  .side-peek.dir-left img{ transform: translateY(var(--idleTop2)); }
  /* hovering the hub: head pops out above it, same as the yellow figure */
  .fan.peek .side-peek.dir-left img{
    transform: translateY(var(--peekTop2));
    pointer-events:auto;
    cursor:pointer;
  }
  /* same specificity fix as the about-me figure above (5 classes vs 4) */
  .fan.peek .side-peek.dir-left.risen img{
    transform: translateY(var(--risenTop2));
    filter: drop-shadow(0 14px 26px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(228,228,234,.22));
  }

  /* figure 3 (right side) — own width/top offset via its own custom properties */
  .side-peek.dir-right img{
    position:absolute;
    top:calc(var(--glowPad) + var(--levelAdjust3) + var(--extraDown3)); left:var(--glowPad);
    width:var(--imgW3); height:var(--imgH3);
    object-fit:cover;
    user-select:none; -webkit-user-drag:none;
    transition: transform .6s cubic-bezier(.22,.9,.24,1), filter .4s ease;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.5));
    pointer-events:none;
  }
  .side-peek.dir-right img{ transform: translateY(var(--idleTop3)); }
  .fan.peek .side-peek.dir-right img{
    transform: translateY(var(--peekTop3));
    pointer-events:auto;
    cursor:pointer;
  }
  .fan.peek .side-peek.dir-right.risen img{
    transform: translateY(var(--risenTop3));
    filter: drop-shadow(0 14px 26px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(228,228,234,.22));
  }

  .side-label{
    position:absolute;
    top:50%; left:50%;
    font-size:12px;
    color:var(--ink-dim);
    white-space:nowrap;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease, color .3s ease;
    z-index:32;
    pointer-events:none;
  }
  .side-label.side-label-left{
    transform: translate(calc(-50% - var(--sideOffsetX)), calc(-1 * (var(--hubR) + var(--baseH2)) - 20px));
  }
  #sideLeftPeek.risen ~ .side-label-left{ opacity:1; }
  .side-label.side-label-right{
    transform: translate(calc(-50% + var(--sideOffsetX3)), calc(-1 * (var(--hubR) + var(--baseH3)) - 20px));
  }
  #sideRightPeek.risen ~ .side-label-right{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    .peekbox img, .side-peek img, .hub, .socials{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<header class="top">
  <span>GRiM.COM</span>
  <span>Nisaiah - Barbosa</span>
</header>

<div class="wrap">
  <div class="fan" id="fan">

    <div class="orbit-system" aria-hidden="true">
      <div class="orbit-ring mercury"><div class="planet"></div></div>
      <div class="orbit-ring venus"><div class="planet"></div></div>
      <div class="orbit-ring earth"><div class="planet">
        <div class="moon-ring"><div class="moon"></div></div>
      </div></div>
      <div class="orbit-ring mars"><div class="planet"></div></div>
      <div class="orbit-ring jupiter"><div class="planet"></div></div>
      <div class="orbit-ring saturn"><div class="planet"></div></div>
      <div class="orbit-ring uranus"><div class="planet"></div></div>
      <div class="orbit-ring neptune"><div class="planet"></div></div>
    </div>

    <a href="about/index.html" class="peekbox" id="peekbox" aria-label="About me">
      <img src="images/about.png" alt="About me">
    </a>
    <span class="peek-label">About Me — click to explore</span>

    <div class="hub" id="hub">
      <img src="images/logo.png" alt="Grim logo">
    </div>
    <div class="hub-hit" id="hubHit"></div>

    <a href="music.html" class="side-peek dir-left" id="sideLeftPeek" aria-label="Music">
      <img src="images/music.png" alt="">
    </a>
    <span class="side-label side-label-left">Music</span>
    <a href="https://barbosan.myportfolio.com/photos" class="side-peek dir-right" id="sideRightPeek" aria-label="Photo &amp; Video" target="_blank" rel="noopener">
      <img src="images/video.png" alt="">
    </a>
    <span class="side-label side-label-right">Photo &amp; Video</span>

    <div class="socials">
      <a href="https://www.instagram.com/nisaia.h/" class="social-icon" title="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      </a>
      <a href="https://www.youtube.com/@GRiMSOUNDS30" class="social-icon" title="YouTube" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M10.5 9.5L15 12l-4.5 2.5z" fill="currentColor" stroke="none" style="fill:var(--ink-dim)"/></svg>
      </a>
      <a href="https://www.linkedin.com/in/nisaiah-barbosa-220388301/" class="social-icon" title="LinkedIn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V16M8 7.8v.1M12 16v-5.5M12 12.8c0-1.3 1-2.3 2.3-2.3S16.5 11.5 16.5 12.8V16"/></svg>
      </a>
    </div>

  </div>


  <p class="hint" id="hint"><b>Hover the mark</b> to see me peek out. Hover me to rise up and click through. On phones, tap instead.</p>
</div>

<div class="player-hint" id="playerHint" aria-hidden="true">
  <span>click for tunes</span>
</div>

<div class="player-menu">
  <button type="button" class="player-nav-btn" id="prevBtn" aria-label="Previous track" title="Previous track">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="4" y="5" width="2" height="14" rx="1" fill="currentColor"/>
      <path d="M19 6L9 12l10 6V6z" fill="currentColor"/>
    </svg>
  </button>

  <button type="button" class="player-btn" id="playerBtn" aria-label="Play or pause" title="Play / pause">
    <svg class="icon-play" viewBox="0 0 24 24">
      <path d="M8 5.5v13l11-6.5-11-6.5z"/>
    </svg>
    <svg class="bars" viewBox="0 0 24 24" fill="none">
      <rect x="4"  y="9"  width="3" height="6" rx="1" fill="currentColor" style="color:var(--ink-dim)"/>
      <rect x="10.5" y="5" width="3" height="14" rx="1" fill="currentColor" style="color:var(--ink-dim)"/>
      <rect x="17" y="11" width="3" height="2"  rx="1" fill="currentColor" style="color:var(--ink-dim)"/>
    </svg>
  </button>

  <button type="button" class="player-nav-btn" id="nextBtn" aria-label="Next track" title="Next track">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="18" y="5" width="2" height="14" rx="1" fill="currentColor"/>
      <path d="M5 6l10 6-10 6V6z" fill="currentColor"/>
    </svg>
  </button>
</div>
<audio id="bgAudio" preload="none"></audio>

<script>
  const fan = document.getElementById('fan');
  const hubHit = document.getElementById('hubHit');
  const hint = document.getElementById('hint');

  // Every image that can independently "rise" to full view once peeking.
  // Listening on the image itself (not the glow-padded wrapper) keeps the
  // interactive hit-area matched to the actual character, not its shadow
  // breathing room — otherwise hovering near the logo can trigger a rise
  // before you've actually reached the figure.
  // Add future entries here (e.g. the right-side peek) and everything below
  // — hover, tap, outside-click-reset — just works for it too.
  const peekImgs = [
    document.querySelector('#peekbox img'),
    document.querySelector('#sideLeftPeek img'),
    document.querySelector('#sideRightPeek img'),
  ].filter(Boolean);

  let isTouch = false;
  let peeked = false;

  function setPeek(on){
    peeked = on;
    fan.classList.toggle('peek', on);
    if(!on){ peekImgs.forEach(img => img.parentElement.classList.remove('risen')); }
    hint.style.opacity = on ? '0' : '1';
  }
  function setRisen(img, on){
    img.parentElement.classList.toggle('risen', on);
  }

  /* Desktop: hover */
  fan.addEventListener('mouseenter', () => { if(!isTouch) setPeek(true); });
  fan.addEventListener('mouseleave', () => { if(!isTouch) setPeek(false); });
  peekImgs.forEach(img => {
    img.addEventListener('mouseenter', () => { if(!isTouch) setRisen(img, true); });
    img.addEventListener('mouseleave', () => { if(!isTouch) setRisen(img, false); });
  });

  /* Mobile: tap */
  hubHit.addEventListener('touchstart', () => { isTouch = true; }, {passive:true});
  hubHit.addEventListener('click', (e) => {
    if(isTouch){ e.preventDefault(); setPeek(!peeked); }
  });
  peekImgs.forEach(img => {
    img.addEventListener('click', (e) => {
      if(isTouch){
        if(!img.parentElement.classList.contains('risen')){
          e.preventDefault();
          setRisen(img, true);
        }
        // second tap on this same element falls through and navigates
      }
    });
  });
  document.addEventListener('click', (e) => {
    if(isTouch && !fan.contains(e.target)){ setPeek(false); }
  });

  /* ============ MUSIC PLAYER (bottom-right menu: prev / play-pause / next) ============ */
  // Drop your mp3s in a "music" folder next to this file and list their
  // filenames here — that's the only thing that needs to change once you
  // have tracks ready. Nothing else about the player depends on this list.
  const TRACKS = [
    'music/confetti.mp3',
    'music/if_u_need.mp3',
    'music/something_wrong_withchu.mp3',
    'music/cantu.mp3',
    'music/ni_and_kthej.mp3',
  ];

  const playerBtn = document.getElementById('playerBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const bgAudio = document.getElementById('bgAudio');
  const playerHint = document.getElementById('playerHint');

  // -1 = nothing loaded yet (first press picks a random track, like before)
  let currentIndex = -1;

  function loadTrack(index){
    if(TRACKS.length === 0) return;
    currentIndex = ((index % TRACKS.length) + TRACKS.length) % TRACKS.length;
    bgAudio.src = TRACKS[currentIndex];
    bgAudio.play().catch(() => {
      // no file there yet, or autoplay was blocked — fail quietly rather
      // than throwing, since the player should stay harmless until real
      // tracks are added
      playerBtn.classList.remove('playing');
    });
  }

  function togglePlayPause(){
    if(TRACKS.length === 0) return;
    if(currentIndex === -1){
      loadTrack(Math.floor(Math.random() * TRACKS.length));
      return;
    }
    if(bgAudio.paused){
      bgAudio.play().catch(() => {});
    } else {
      bgAudio.pause();
    }
  }

  function nextTrack(){ loadTrack(currentIndex === -1 ? 0 : currentIndex + 1); }
  function prevTrack(){ loadTrack(currentIndex === -1 ? 0 : currentIndex - 1); }

  playerBtn.addEventListener('click', togglePlayPause);
  nextBtn.addEventListener('click', nextTrack);
  prevBtn.addEventListener('click', prevTrack);

  // "click for tunes" hides the instant a track is actually playing, and
  // comes back whenever playback is paused — tied straight to the audio
  // element's own state rather than a one-time flag.
  bgAudio.addEventListener('play',  () => {
    playerBtn.classList.add('playing');
    if(playerHint) playerHint.classList.add('hidden');
  });
  bgAudio.addEventListener('pause', () => {
    playerBtn.classList.remove('playing');
    if(playerHint) playerHint.classList.remove('hidden');
  });
  // a track finishing plays straight into the next one, like a real playlist
  bgAudio.addEventListener('ended', () => nextTrack());
  bgAudio.addEventListener('error', () => {
    playerBtn.classList.remove('playing');
    if(playerHint) playerHint.classList.remove('hidden');
  });
</script>

</body>
